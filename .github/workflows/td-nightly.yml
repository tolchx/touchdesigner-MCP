# Nightly TouchDesigner live check — POP matrix baseline gate.
#
# Runs the live POP matrix on the TD machine (self-hosted runner), then gates
# the result against the GIT baseline (docs/pop_matrix.json at HEAD):
#   - CI FAILS if ok_con_input drops below the committed baseline (89 as of
#     TD 2025.31760, 97 types — see docs/POPs_VALIDATION.md)
#   - CI FAILS if TD is unreachable or the bridge is wedged (port bound but
#     refused) — an untestable TD is a red build, not a silent pass
#   - CI FAILS if the td_verify_wiring live acceptance detects a broken
#     /connections contract (wrong edges/shape) — the wiring-read path is
#     load-bearing for every network-building agent (AGENTS.md rule 16)
#   - CI FAILS on implausible gains (>+10) or types that stop creating
#   - After a PASS, auto-commits the fresh JSON when ONLY metadata moved
#     (build/generated_at/sandbox) — real evidence changes are never
#     auto-committed and block adoption until reviewed
#   - Artifacts: the fresh matrix JSON + gate log, 14 days retention
#
# Requires: a self-hosted runner on the TD machine (Windows, TouchDesigner
# running with the HTTP API on 127.0.0.1:44444, Python on PATH). Until that
# runner exists, this workflow shows as "waiting for runner" — the offline
# part of the gate runs in the scheduled-offline job below so regressions in
# the checker itself are still caught nightly.

name: td-nightly-pop-matrix

on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC nightly
  workflow_dispatch: {} # manual trigger for debugging

jobs:
  # ── Offline leg: always runs (GitHub-hosted) ────────────────────────────────
  # Catches checker regressions and baseline corruption without a TD machine.
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline suite (checker tests + Node tests)
        run: |
          python -m pytest tests/test_pop_matrix_baseline.py -q 2>/dev/null || \
            python -m unittest tests.test_pop_matrix_baseline -v
          cd mcp && npm ci && npm run build && node --test

      - name: Baseline integrity (committed JSON is structurally valid)
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          out = subprocess.run(
              ["git", "show", "HEAD:docs/pop_matrix.json"],
              capture_output=True, text=True, check=True).stdout
          d = json.loads(out)
          sys.path.insert(0, ".")
          from scripts.check_pop_matrix_baseline import _validate
          _validate(d, "baseline")
          print(f"baseline ok: ok_con_input={d['ok_con_input_count']} "
                f"types={d['type_count']} build={d['td_build']}")
          EOF

  # ── Live leg: self-hosted runner on the TD machine ──────────────────────────
  live-gate:
    runs-on: [self-hosted, touchdesigner]
    needs: offline-gate
    steps:
      - uses: actions/checkout@v4

      - name: Probe TD bridge (fail fast if wedged or down)
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 3; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:44444/info" `
                -TimeoutSec 10 -UseBasicParsing
              if ($r.StatusCode -eq 200 -and $r.Content.Length -gt 0) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) {
            Write-Host "##vso[task.logissue type=error]TD bridge unreachable on 127.0.0.1:44444 — restart TouchDesigner (check for modal dialogs) and re-run."
            exit 1
          }

      - name: Install Node deps (for wiring tool acceptance)
        run: npm ci

      - name: td_verify_wiring live acceptance (broken /connections contract fails the build)
        # scripts/live/wiring_tool_live.mjs builds its own mergePOP sandbox and
        # exercises the MCP wiring tool end-to-end: exact-match pass, extra-edge
        # detection, broken-net detection, explicit error without expectation.
        # Exit codes: 0 pass, 1 failures, 2 TD unreachable — any non-zero fails
        # this job, consistent with the probe philosophy above.
        run: node scripts/live/wiring_tool_live.mjs

      - name: Read-endpoint additive-key contract (stale bridge fails the build)
        # scripts/live/read_contract_live.py checks that /verify exposes the A1
        # keys (errors_truncated/warnings_truncated) and /healthcheck exposes
        # the A3 key (forceCook). A TD running a pre-A1/A3 bridge answers 200
        # with plausible-but-incomplete payloads — that is a red build here,
        # same silent-fallback class the /connections gate catches.
        run: python scripts/live/read_contract_live.py

      - name: Run live POP matrix (fresh evidence)
        run: python toe/src/test_pop_matrix.py --keep

      - name: Gate against git baseline (auto-commits metadata-only refreshes)
        run: python scripts/check_pop_matrix_baseline.py --live docs/pop_matrix.json

      - name: Push metadata-only baseline refresh
        # The gate commits docs/pop_matrix.json itself when only per-run
        # metadata moved; this pushes that commit so tomorrow's nightly
        # compares against current metadata. Evidence changes gate-fail before
        # this step, so nothing questionable is ever pushed.
        run: git push origin HEAD

      - name: Upload matrix artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pop-matrix-${{ github.run_id }}
          path: |
            docs/pop_matrix.json
          retention-days: 14
          if-no-files-found: error
